<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ус уугаарай</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; margin: 0 auto; height: 100vh; width: auto; aspect-ratio: 9 / 16; }
  body.render canvas { height: 1920px; width: 1080px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
         font: 13px Inter, system-ui, sans-serif; color: #ddd; background: rgba(0,0,0,.55); }
  #bar input { flex: 1; }
  body.render #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="bar"><button id="play" type="button">⏯</button><input id="seek" type="range" min="0" max="57" step="0.01" value="0"><span id="time">0.00</span></div>
<script src="src/util.js"></script>
<script src="src/landscape.js"></script>
<script src="src/figure.js"></script>
<script src="src/science.js"></script>
<script src="src/pov.js"></script>
<script src="src/glass.js"></script>
<script src="src/scenes.js"></script>
<script>
  /* Preview player. The renderer (render.mjs) loads this page with ?render and calls renderAt(t) per frame. */
  const canvas = document.getElementById('c');
  MAIN = canvas.getContext('2d');
  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  if (RENDER) document.body.classList.add('render');
  window.READY = Promise.all([
    document.fonts.load('800 136px "JetBrains Mono"'),
    document.fonts.load('700 34px Inter'),
    document.fonts.load('800 42px Inter'),
    document.fonts.load('900 140px "Inter Display"'),
  ]).then(() => { renderAt(0); return true; });
  window.renderAt = renderAt;
  window.exportCues = exportCues;
  window.DURATION = DURATION;
  if (!RENDER) {
    let t = parseFloat(params.get('t') || '0'), playing = !params.has('t'), last = performance.now();
    const seek = document.getElementById('seek'), lab = document.getElementById('time');
    const audio = new Audio('build/audio.wav');
    document.getElementById('play').onclick = () => { playing = !playing; if (playing) { audio.currentTime = t; audio.play().catch(() => {}); } else audio.pause(); };
    seek.oninput = () => { t = +seek.value; audio.currentTime = t; };
    window.READY.then(() => {
      const loop = (now) => {
        if (playing) { t += (now - last) / 1000; if (t > DURATION) { t = 0; audio.currentTime = 0; } }
        last = now;
        renderAt(t);
        seek.value = t; lab.textContent = t.toFixed(2);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
  }
</script>
</body>
</html>
